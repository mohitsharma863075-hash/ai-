        body.dark {

            --user-msg-bg: #334155;

        body {
            background-color: var(--bg-body);

            display: flex;

        /* Main container - card style */
        .app-container {

        /* Header: Logo + Name + Dark mode toggle */

/* ===== Animated Nova Logo ===== */

.logo-icon {
    position: relative;

    width: 58px;
    height: 58px;

    border-radius: 50%;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(255,255,255,0.08);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border: 1px solid rgba(255,255,255,0.18);

    box-shadow:
        inset 0 2px 6px rgba(255,255,255,0.25),
        inset 0 -4px 8px rgba(0,0,0,0.15),
        0 0 18px rgba(59,130,246,0.25);

    animation:
        logoFloat 4s ease-in-out infinite,
        logoGlow 3s ease-in-out infinite;

    transition: all 0.3s ease;
}

/* rotating gradient ring */
.logo-icon::before {
    content: "";

    position: absolute;
    inset: -3px;

    border-radius: 50%;

    background: conic-gradient(
        from 0deg,
        #00f0ff,
        #3b82f6,
        #8b5cf6,
        #ff00c8,
        #00f0ff
    );

    animation: logoRotate 4s linear infinite;

    z-index: -2;
}

/* inner glass layer */
.logo-icon::after {
    content: "";

    position: absolute;
    inset: 3px;

    border-radius: 50%;

    background: rgba(15,23,42,0.15);

    backdrop-filter: blur(10px);

    z-index: -1;
}

/* logo image */
.logo-icon img {
    width: 88%;
    height: 88%;
    object-fit: cover;

    border-radius: 50%;

    z-index: 2;
}

/* hover effect */
.logo-icon:hover {
    transform: scale(1.08) rotate(3deg);

    box-shadow:
        0 0 20px rgba(59,130,246,0.5),
        0 0 40px rgba(139,92,246,0.35),
        0 0 70px rgba(255,0,200,0.2);
}


/* ===== ANIMATIONS ===== */

@keyframes logoRotate {
    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }
}

@keyframes logoFloat {
    0% {
        transform: translateY(0px);
    }

    50% {
        transform: translateY(-4px);
    }

    100% {
        transform: translateY(0px);
    }
}

@keyframes logoGlow {
    0% {
        filter: drop-shadow(0 0 6px rgba(59,130,246,0.25));
    }

    50% {
        filter: drop-shadow(0 0 18px rgba(139,92,246,0.5));
    }

    100% {
        filter: drop-shadow(0 0 6px rgba(59,130,246,0.25));
    }
}

        .brand-name h1 {

        /* ===== 3D Glass Mic Button ===== */

.mic-container {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* GLASS MIC BUTTON */
.mic-button {
    position: relative;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);

    background: rgba(255,255,255,0.08);

    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow:
        inset 0 2px 6px rgba(255,255,255,0.25),
        inset 0 -4px 8px rgba(0,0,0,0.15),
        0 8px 18px rgba(0,0,0,0.18),
        0 0 12px rgba(59,130,246,0.25);

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 1.6rem;
    cursor: pointer;

    overflow: hidden;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
}

/* glossy top reflection */
.mic-button::before {
    content: "";
    position: absolute;
    top: 5px;
    left: 8px;

    width: 70%;
    height: 35%;

    background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.7),
        rgba(255,255,255,0.05)
    );

    border-radius: 50%;
    filter: blur(1px);

    pointer-events: none;
}

/* hover effect */
.mic-button:hover {
    transform: translateY(-2px) scale(1.03);

    box-shadow:
        inset 0 2px 8px rgba(255,255,255,0.3),
        inset 0 -5px 10px rgba(0,0,0,0.18),
        0 12px 25px rgba(0,0,0,0.22),
        0 0 18px rgba(59,130,246,0.35);
}

/* press effect */
.mic-button:active {
    transform: scale(0.96);
}

/* ===== Listening Mode ===== */

.mic-button.listening {
    background: rgba(59,130,246,0.18);

    box-shadow:
        inset 0 2px 8px rgba(255,255,255,0.35),
        inset 0 -4px 8px rgba(0,0,0,0.18),
        0 0 18px rgba(59,130,246,0.6),
        0 0 40px rgba(59,130,246,0.35),
        0 0 70px rgba(59,130,246,0.18);

    animation: micPulse 1.6s infinite;
}

/* pulse */
@keyframes micPulse {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.06);
    }

    100% {
        transform: scale(1);
    }
}

/* ===== Siri Waves ===== */

.wave {
    position: absolute;

    width: 62px;
    height: 62px;

    border-radius: 50%;

    border: 2px solid rgba(59,130,246,0.4);

    opacity: 0;
    pointer-events: none;
}

/* animate only while listening */
.mic-button.listening ~ .wave1,
.mic-button.listening ~ .wave2,
.mic-button.listening ~ .wave3 {
    animation: siriWave 2.2s infinite;
}

.mic-button.listening ~ .wave2 {
    animation-delay: 0.5s;
}

.mic-button.listening ~ .wave3 {
    animation-delay: 1s;
}

@keyframes siriWave {
    0% {
        transform: scale(1);
        opacity: 0.7;
    }

    100% {
        transform: scale(2.5);
        opacity: 0;
    }
}

/* dark mode tuning */
body.dark .mic-button {
    background: rgba(255,255,255,0.06);

    box-shadow:
        inset 0 2px 6px rgba(255,255,255,0.12),

}

        /* Typing indicator */

        @keyframes blink {

/* =========================
   SIRI SEARCH BOX EFFECT
========================= */

.input-wrapper{
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;

    background: rgba(255,255,255,0.08);

    border-radius: 60px;

    padding: 8px 8px 8px 20px;

    border: 1px solid rgba(255,255,255,0.12);

    overflow: visible;

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    transition: all 0.3s ease;

    z-index: 2;
}

/* =========================
   SIRI BORDER WAVES
========================= */

.input-wrapper::before,
.input-wrapper::after{
    content: "";

    position: absolute;
    inset: -3px;

    border-radius: 70px;

    background: conic-gradient(
        from 0deg,
        #00f0ff,
        #3b82f6,
        #8b5cf6,
        #ff00c8,
        #00f0ff
    );

    z-index: -2;

    opacity: 0;

    filter: blur(12px);

    transition: opacity 0.3s ease;
}

/* inner glow */
.input-wrapper::after{
    inset: -1px;
    filter: blur(20px);
    opacity: 0;
}

/* =========================
   ACTIVE SEARCH MODE
========================= */

.input-wrapper.searching::before{
    opacity: 1;

    animation:
        siriBorderRotate 3s linear infinite,
        siriPulse 2s ease-in-out infinite;
}

.input-wrapper.searching::after{
    opacity: 0.8;

    animation:
        siriBorderRotate 5s linear infinite reverse,
        siriPulse 2.5s ease-in-out infinite;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes siriBorderRotate{
    0%{
        transform: rotate(0deg);
    }

    100%{
        transform: rotate(360deg);
    }
}

@keyframes siriPulse{
    0%{
        transform: scale(1);

    50%{
        transform: scale(1.02);

    100%{
        transform: scale(1);

}

/**

function formatText(text, style) {

        'emoji': text.split('').map(char => {

            return emojiMap[char.toLowerCase()] || char;
        }).join(''),

}

/**
 * Convert units (length, weight, temperature, volume)
 */
function convertUnits(value, fromUnit, toUnit) {
    const conversions = {
        // Length
        'km to miles': v => v * 0.621371,
        'miles to km': v => v * 1.60934,
        'meters to feet': v => v * 3.28084,
        'feet to meters': v => v * 0.3048,
        'cm to inches': v => v * 0.393701,
        'inches to cm': v => v * 2.54,
        
        // Weight
        'kg to lbs': v => v * 2.20462,
        'lbs to kg': v => v * 0.453592,
        'grams to ounces': v => v * 0.035274,
        'ounces to grams': v => v * 28.3495,
        
        // Temperature
        'c to f': v => (v * 9/5) + 32,
        'f to c': v => (v - 32) * 5/9,
        'c to k': v => v + 273.15,
        'k to c': v => v - 273.15,
        
        // Volume
        'liters to gallons': v => v * 0.264172,
        'gallons to liters': v => v * 3.78541
    };
    
    const key = `${fromUnit} to ${toUnit}`;
    if (conversions[key]) {
        const result = conversions[key](value).toFixed(2);
        return `📐 ${value} ${fromUnit} = ${result} ${toUnit}`;
    }
    return null;
}

        if (data.title && data.extract) {

        }
        return `Couldn't find "${query}" on Wikipedia. Try a different term.`;
    } catch (error) {
        return "Wikipedia search temporarily unavailable.";
    }
}

/**
 * Try to detect if user wants to open an app/website
 */
function tryOpenAppOrWebsite(userMessage) {
    const lowerMsg = userMessage.toLowerCase().trim();
    
    // Detect "open", "launch", "go to" intent
    const hasOpenIntent = lowerMsg.includes('open') || lowerMsg.includes('launch') || lowerMsg.includes('go to');
    if (!hasOpenIntent) return null;
    
    let target = lowerMsg;
    if (lowerMsg.includes('open ')) target = lowerMsg.split('open ')[1];
    else if (lowerMsg.includes('launch ')) target = lowerMsg.split('launch ')[1];
    else if (lowerMsg.includes('go to ')) target = lowerMsg.split('go to ')[1];
    
    target = target.replace(/[?.!]/g, '').trim();
    
    for (const [appName, appData] of Object.entries(APP_DATABASE)) {
        for (const keyword of appData.keywords) {
            if (target.includes(keyword) || target.includes(appName)) {
                return { name: appName, url: appData.url };
            }
        }
    }
    
    // If it looks like a domain
    if (target.includes('.com') || target.includes('.in') || target.includes('.org')) {
        let url = target;
        if (!url.startsWith('http')) url = 'https://' + url;
        return { name: target.split('.')[0], url: url };
    }
    
    return null;
}

// ========== CONFIGURATION ==========
const YOUTUBE_CONFIG = {
    // YouTube Embed API base URL
    EMBED_BASE: "https://www.youtube.com/embed/",
    
    // YouTube Search API (for getting video ID)
    SEARCH_API: "https://www.googleapis.com/youtube/v3/search",

    // Fallback: Direct search URL agar API key kaam nahi kare
    SEARCH_URL: "https://www.youtube.com/results?search_query="
};

// ========== 🎬 MAIN FUNCTION: Play on YouTube ==========
/**
 * Play a song or video on YouTube
 * @param {string} query - Song/video name (e.g., "despacito", "funny cats")
 * @param {boolean} isVoice - Voice command se aaya hai ya nahi
 * @returns {Promise<boolean>} - Success ya fail
 */
async function playOnYouTube(query, isVoice = false) {
    if (!query || query.trim() === "") {
        const errorMsg = "❌ Kuch bhi to batao! Kaunsa song/video play karna hai?";
        appendMessage(errorMsg, "ai", true);
        if (isVoice) speakText("Please tell me what you want to play");
        return false;
    }
    
    // Remove "play", "song", "video", "music" words from query
    let searchQuery = query
        .replace(/^(play|song|video|music)\s+/i, '')
        .replace(/\s+(song|video|music)$/i, '')
        .trim();
    
    if (searchQuery === "") {
        searchQuery = query;
    }
    
    // Show searching status
    appendMessage(`🎵 Searching YouTube for "${searchQuery}"...`, "ai");
    
    try {
        // Method 1: Try with YouTube API (if API key is configured)
        if (YOUTUBE_CONFIG.API_KEY && YOUTUBE_CONFIG.API_KEY !== "AIzaSyDummyKeyReplaceWithYourOwn") {
            const videoId = await searchYouTubeAPI(searchQuery);
            if (videoId) {
                return openYouTubeVideo(videoId, searchQuery, isVoice);
            }
        }
        
        // Method 2: Fallback - Direct YouTube search link
        return openYouTubeSearch(searchQuery, isVoice);
        
    } catch (error) {
        console.error("YouTube play error:", error);
        // Fallback to direct search
        return openYouTubeSearch(searchQuery, isVoice);
    }
}

// ========== 🔍 YouTube API Search ==========
/**
 * Search YouTube API and get first video ID
 */
async function searchYouTubeAPI(query) {
    try {
        const url = `${YOUTUBE_CONFIG.SEARCH_API}?part=snippet&maxResults=1&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_CONFIG.API_KEY}`;
        
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.items && data.items.length > 0) {
            return data.items[0].id.videoId;
        }
        return null;
    } catch (error) {
        console.error("YouTube API error:", error);
        return null;
    }
}

/**
 * Is command a music/video play command?
 * Use this function in your main processUserMessage()
 */
function isPlayCommand(message) {
    const lowerMsg = message.toLowerCase();
    const playPatterns = [
        /^(play|song|video|music)\s+/i,  // "play despacito", "song shape of you"
        /\s+(play|song|video)$/i,         // "despacito play"
        /^(play|play song|play video|play music)$/i  // exact match
    ];
    
    for (const pattern of playPatterns) {
        if (pattern.test(lowerMsg)) {
            return true;
        }
    }
    return false;
}

/**
 * Extract search query from play command
 */
function extractPlayQuery(message) {
    let query = message
        .replace(/^(play|song|video|music)\s+/i, '')
        .replace(/\s+(play|song|video)$/i, '')
        .trim();
    
    // Handle "play despacito song" → "despacito"
    query = query.replace(/\s+(song|video|music)$/i, '');
    
    return query;
}

/**
 * Initialize speech recognition
 */
function initSpeechRecognition() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        if (DOM.voiceStatusDiv) DOM.voiceStatusDiv.innerText = "❌ Voice not supported. Try Chrome/Edge.";
        if (DOM.micBtn) DOM.micBtn.disabled = true;
        return null;
    }
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recog = new SpeechRecognition();
    recog.continuous = false;
    recog.interimResults = false;
    recog.lang = 'en-US';
    
    recog.onstart = () => {
        isListening = true;
        if (DOM.micBtn) DOM.micBtn.classList.add("listening");
        if (DOM.voiceStatusDiv) DOM.voiceStatusDiv.innerText = "🎤 Listening... speak now";
    };
    
    recog.onerror = (event) => {
        if (DOM.voiceStatusDiv) DOM.voiceStatusDiv.innerText = `🎙️ Error: ${event.error}`;
        stopListeningUI();
    };
    
    recog.onend = () => {
        stopListeningUI();
        if (DOM.voiceStatusDiv) DOM.voiceStatusDiv.innerText = "";
    };
    
    recog.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        if (transcript && transcript.trim()) {
            if (DOM.messageInput) DOM.messageInput.value = transcript;
            if (DOM.voiceStatusDiv) DOM.voiceStatusDiv.innerText = `✅ Recognized: "${transcript}" → processing...`;
            await processUserMessage(transcript, true);
            if (DOM.voiceStatusDiv) DOM.voiceStatusDiv.innerText = "";
        } else {
            if (DOM.voiceStatusDiv) DOM.voiceStatusDiv.innerText = "No speech detected.";
            setTimeout(() => { if(DOM.voiceStatusDiv) DOM.voiceStatusDiv.innerText = ""; }, 1500);
        }
        stopListeningUI();
    };
    
    return recog;
}

function stopListeningUI() {
    if (recognition) {
        try { recognition.stop(); } catch(e) {}
    }
    isListening = false;
    if (DOM.micBtn) DOM.micBtn.classList.remove("listening");
}

function startVoiceInput() {
    if (!recognition) return;
    if (isListening) {
        recognition.stop();
        stopListeningUI();
        return;
    }
    try {
        recognition.start();
    } catch(err) {
        if (DOM.voiceStatusDiv) DOM.voiceStatusDiv.innerText = "Cannot start mic";
    }
}

// ======================== DARK MODE ========================

function updateThemeUI(theme) {
    const icon = document.getElementById("themeIcon");
    const label = document.getElementById("themeLabel");
    if (!icon || !label) return;
    
    if (theme === "dark") {
        icon.innerText = "☀️";
        label.innerText = "Light";
    } else {
        icon.innerText = "🌙";
        label.innerText = "Dark";
    }
}

function toggleTheme() {
    const isDark = document.body.classList.contains("dark");
    if (isDark) {
        document.body.classList.remove("dark");
        localStorage.setItem("nova_theme", "light");
        updateThemeUI("light");
    } else {
        document.body.classList.add("dark");
        localStorage.setItem("nova_theme", "dark");
        updateThemeUI("dark");
    }
}

function initTheme() {
    const saved = localStorage.getItem("nova_theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const isDark = saved === "dark" || (saved === null && prefersDark);
    
    if (isDark) {
        document.body.classList.add("dark");
        updateThemeUI("dark");
    } else {
        document.body.classList.remove("dark");
        updateThemeUI("light");
    }
}

// ======================== EVENT HANDLERS ========================

async function handleSend() {
    const text = DOM.messageInput?.value.trim();
    if (text === "") return;
    await processUserMessage(text, false);
}

// ======================== INITIALIZATION ========================

function initDOM() {
    DOM.chatContainer = document.getElementById("chatMessages");
    DOM.messageInput = document.getElementById("messageInput");
    DOM.sendBtn = document.getElementById("sendButton");
    DOM.micBtn = document.getElementById("micButton");
    DOM.themeToggle = document.getElementById("themeToggle");
    DOM.voiceStatusDiv = document.getElementById("voiceStatus");
    DOM.inputWrapper = document.querySelector(".input-wrapper");
}

function initEventListeners() {
    if (DOM.sendBtn) DOM.sendBtn.addEventListener("click", handleSend);
    if (DOM.themeToggle) DOM.themeToggle.addEventListener("click", toggleTheme);
    
    if (DOM.messageInput) {
        DOM.messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });
    }
}

function initVoice() {
    if (window.SpeechRecognition || window.webkitSpeechRecognition) {
        recognition = initSpeechRecognition();
        if (DOM.micBtn) {
            DOM.micBtn.onclick = () => startVoiceInput();
        }
    } else {
        if (DOM.micBtn) {
            DOM.micBtn.disabled = true;
            DOM.micBtn.style.opacity = "0.5";
        }
        if (DOM.voiceStatusDiv) DOM.voiceStatusDiv.innerText = "Voice input unsupported.";
    }
}

// Load voices for TTS
if (window.speechSynthesis) {
    window.speechSynthesis.getVoices();
}

// Initialize everything when DOM is ready
document.addEventListener("DOMContentLoaded", () => {
    initDOM();
    initTheme();
    initEventListeners();
    initVoice();
    
    if (DOM.messageInput) DOM.messageInput.focus();
});
</script>
